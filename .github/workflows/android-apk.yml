
name: Build Nexa AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-apk.yml"
      - "Nexa_AI_Android_Cloud_Starter/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: Nexa_AI_Android_Cloud_Starter
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-AI-debug-APK
          path: Nexa_AI_Android_Cloud_Starter/app/build/outputs/apk/debug/app-debug.apk
