
name: Build Nexa AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-apk.yml"
      - "Nexa_AI_Android_Cloud_Starter/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexa-publish.jks"
          test -s "$RUNNER_TEMP/nexa-publish.jks"

      - name: Build signed release APK
        working-directory: Nexa_AI_Android_Cloud_Starter
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/nexa-publish.jks
          NEXA_KEYSTORE_PASSWORD: ${{ secrets.NEXA_KEYSTORE_PASSWORD }}
          NEXA_KEY_ALIAS: ${{ secrets.NEXA_KEY_ALIAS }}
        run: gradle --no-daemon assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-AI-release-APK
          path: Nexa_AI_Android_Cloud_Starter/app/build/outputs/apk/release/app-release.apk
