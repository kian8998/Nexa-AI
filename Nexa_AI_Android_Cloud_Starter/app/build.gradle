
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nexa.ai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nexa.ai'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('RELEASE_STORE_FILE')
            if (keystorePath != null) {
                storeFile file(keystorePath)
                storePassword System.getenv('NEXA_KEYSTORE_PASSWORD')
                keyAlias System.getenv('NEXA_KEY_ALIAS')
                keyPassword System.getenv('NEXA_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}
